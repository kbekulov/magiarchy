name: Verify archive
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
        env:
          TEST_BROWSERS: chromium,webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-checks
          path: test-results/
